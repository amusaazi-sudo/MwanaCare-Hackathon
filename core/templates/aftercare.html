{% extends "base.html" %}
{% block title %}Aftercare AI | MwanaCare{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="panel">
            <h1 class="h3">Post-immunization Care Assistant</h1>
            <p class="text-secondary">Ask about common symptoms after vaccination.</p>
            <form method="post">
                {% csrf_token %}
                <label class="form-label" for="question">Care question</label>
                <textarea class="form-control mb-3" id="question" name="question" rows="4" placeholder="Example: My child has a mild fever after vaccination.">{{ question }}</textarea>
                <button class="btn btn-primary" type="submit">Ask assistant</button>
            </form>
            {% if answer %}
                <div class="alert alert-success mt-4 mb-0">
                    <strong>Guidance:</strong> {{ answer }}
                </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
